name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Python SQL DW to Parquet/requirements.txt"

      - name: Install system dependencies for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python dependencies
        working-directory: "Python SQL DW to Parquet"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install autopep8

      - name: Lint with autopep8
        working-directory: "Python SQL DW to Parquet"
        run: autopep8 --diff --exit-code *.py

      - name: Run tests
        working-directory: "Python SQL DW to Parquet"
        run: pytest --tb=short

  validate-views:
    name: Validate View Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check view script integrity
        shell: bash
        run: |
          VIEWS_DIR="Python SQL DW to Parquet/sql/data-warehouse-views"
          ERRORS=0

          FILE_COUNT=$(find "$VIEWS_DIR" -name "*.sql" | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "FAILED: No view SQL files found in $VIEWS_DIR"
            exit 1
          fi
          echo "Checking $FILE_COUNT view scripts..."

          for f in "$VIEWS_DIR"/*.sql; do
            # Must start with CREATE OR ALTER VIEW [RDS].[vwXxx] AS
            first_line=$(head -1 "$f")
            if ! echo "$first_line" | grep -qE '^CREATE OR ALTER VIEW \[RDS\]\.\[vw[A-Za-z0-9_]+\] AS$'; then
              echo "BAD HEADER: $f"
              echo "  Got: $first_line"
              ERRORS=$((ERRORS+1))
            fi

            # Must contain FROM RDS.
            if ! grep -q "FROM RDS\." "$f"; then
              echo "MISSING FROM CLAUSE: $f"
              ERRORS=$((ERRORS+1))
            fi

            # Check for UTF-8 BOM
            if python3 -c "import sys; sys.exit(0 if open('$f','rb').read(3) != b'\\xef\\xbb\\xbf' else 1)"; then
              :
            else
              echo "BOM DETECTED: $f"
              ERRORS=$((ERRORS+1))
            fi
          done

          echo ""
          echo "View files checked: $FILE_COUNT"
          if [ $ERRORS -gt 0 ]; then
            echo "FAILED: $ERRORS error(s) found"
            exit 1
          else
            echo "All view scripts are valid."
          fi
