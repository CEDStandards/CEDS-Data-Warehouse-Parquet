name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Python SQL DW to Parquet/requirements.txt"

      - name: Install dependencies
        working-directory: "Python SQL DW to Parquet"
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow pandas numpy openpyxl pytest autopep8

      - name: Lint with autopep8
        working-directory: "Python SQL DW to Parquet"
        run: autopep8 --diff --exit-code *.py sql/*.py

      - name: Run tests
        working-directory: "Python SQL DW to Parquet"
        run: pytest --tb=short

  validate-views:
    name: Validate View Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check view script integrity
        shell: bash
        run: |
          VIEWS_DIR="Python SQL DW to Parquet/sql/data-warehouse-views"
          ERRORS=0

          for f in "$VIEWS_DIR"/*.sql; do
            # Must start with CREATE OR ALTER VIEW [RDS].[vwXxx] AS
            first_line=$(head -1 "$f")
            if ! echo "$first_line" | grep -qE '^CREATE OR ALTER VIEW \[RDS\]\.\[vw[A-Za-z0-9_]+\] AS$'; then
              echo "BAD HEADER: $f"
              echo "  Got: $first_line"
              ERRORS=$((ERRORS+1))
            fi

            # Must contain FROM RDS.
            if ! grep -q "FROM RDS\." "$f"; then
              echo "MISSING FROM CLAUSE: $f"
              ERRORS=$((ERRORS+1))
            fi
          done

          echo ""
          echo "View files checked: $(ls "$VIEWS_DIR"/*.sql | wc -l)"
          if [ $ERRORS -gt 0 ]; then
            echo "FAILED: $ERRORS error(s) found"
            exit 1
          else
            echo "All view scripts are valid."
          fi
